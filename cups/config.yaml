---
version: 0.0.6
slug: cups-deb
name: CUPS Print Server (debian)
description: CUPS print server for network printing, Debian variant
url: https://github.com/cybik/cups-addon-debian
codenotary: cybik@cybik.moe
arch:
  - amd64
hassio_api: true
host_network: true
usb: true
map:
  - data:rw
  - share:rw
init: false
options:
  admin_username: "admin"
  admin_password: "admin"
schema:
  admin_username: str
  admin_password: password
startup: services

image: ghcr.io/cybik/cups-addon-debian-{arch}

udev: true
panel_admin: false
panel_icon: mdi:printer

ports:
  631/tcp: 631
ports_description:
  631/tcp: CUPS web interface and printing port
ingress: true
ingress_entry: files
ingress_port: 631
ingress_stream: true
