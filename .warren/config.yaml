# .warren/config.yaml — per-project defaults for warren
# (https://github.com/jayminwest/warren)
#
# Every run dispatched against this project resolves provider/model
# from here (operator override > project default > agent frontmatter),
# so the built-in pi agent goes to DeepSeek instead of its Anthropic
# default without needing per-run overrides.

defaultProvider: deepseek
defaultModel: deepseek-v4-flash
